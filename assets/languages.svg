<svg xmlns="http://www.w3.org/2000/svg" width="495" height="210" viewBox="0 0 495 210" role="img" aria-label="Top languages for JudeaTablate">
  <defs>
    <linearGradient id="lg-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#E6E6EE"/>
      <stop offset=".7" stop-color="#A9A7B6"/><stop offset="1" stop-color="#F3F3F8"/>
    </linearGradient>
    <linearGradient id="lg-pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4FA3"/><stop offset="1" stop-color="#FF8CC6"/>
    </linearGradient>
    <linearGradient id="lg-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4FA3" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#9C9AA8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FF8CC6" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="lg-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#2A2430" stroke-width=".6" opacity=".55"/>
    </pattern>
    <radialGradient id="lg-glow" cx=".85" cy="0" r=".9">
      <stop offset="0" stop-color="#FF4FA3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FF4FA3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',monospace; }
    .t  { fill: #E6E6EE; font-size: 12px; letter-spacing: 2px; font-weight: 700; }
    .lb { fill: #9C9AA8; font-size: 11px; letter-spacing: 1.2px; }
    .v  { fill: #E6E6EE; font-size: 13px; font-weight: 700; }
    .sm { fill: #9C9AA8; font-size: 9px; letter-spacing: 1.5px; }
    .fade { opacity: 0; animation: in .6s ease-out forwards; }
    .scan { animation: scan 5s linear infinite; }
    .blink { animation: blink 1.6s steps(2) infinite; }
    @keyframes in { to { opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(-20px); } 100% { transform: translateY(240px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>
  <rect x="1" y="1" width="493" height="208" rx="10" fill="#0A090D"/>
