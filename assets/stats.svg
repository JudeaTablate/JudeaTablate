<svg xmlns="http://www.w3.org/2000/svg" width="495" height="210" viewBox="0 0 495 210" role="img" aria-label="GitHub stats for JudeaTablate">
  <defs>
    <linearGradient id="st-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#E6E6EE"/>
      <stop offset=".7" stop-color="#A9A7B6"/><stop offset="1" stop-color="#F3F3F8"/>
    </linearGradient>
    <linearGradient id="st-pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4FA3"/><stop offset="1" stop-color="#FF8CC6"/>
    </linearGradient>
    <linearGradient id="st-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4FA3" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#9C9AA8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FF8CC6" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="st-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#2A2430" stroke-width=".6" opacity=".55"/>
    </pattern>
    <radialGradient id="st-glow" cx=".85" cy="0" r=".9">
      <stop offset="0" stop-color="#FF4FA3" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FF4FA3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',monospace; }
    .t  { fill: #E6E6EE; font-size: 12px; letter-spacing: 2px; font-weight: 700; }
    .lb { fill: #9C9AA8; font-size: 11px; letter-spacing: 1.2px; }
    .v  { fill: #E6E6EE; font-size: 13px; font-weight: 700; }
    .sm { fill: #9C9AA8; font-size: 9px; letter-spacing: 1.5px; }
    .fade { opacity: 0; animation: in .6s ease-out forwards; }
    .scan { animation: scan 5s linear infinite; }
    .blink { animation: blink 1.6s steps(2) infinite; }
    @keyframes in { to { opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(-20px); } 100% { transform: translateY(240px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>
  <rect x="1" y="1" width="493" height="208" rx="10" fill="#0A090D"/>
  <rect x="1" y="1" width="493" height="208" rx="10" fill="url(#st-grid)"/>
  <rect x="1" y="1" width="493" height="208" rx="10" fill="url(#st-glow)"/>
  <rect x="1" y="1" width="493" height="208" rx="10" fill="none" stroke="url(#st-edge)" stroke-width="1.2"/>
  <g stroke="#FF4FA3" stroke-width="2" fill="none">
    <path d="M6 20V6H20"/><path d="M475 6H489V20"/>
    <path d="M6 190V204H20"/><path d="M475 204H489V190"/>
  </g>
  <g clip-path="url(#st-clip)">
    <rect class="scan" x="0" y="0" width="495" height="2" fill="#FF4FA3" opacity=".18"/>
  </g>
  <clipPath id="st-clip"><rect x="1" y="1" width="493" height="208" rx="10"/></clipPath>
  <circle cx="26" cy="27" r="3.5" fill="#FF4FA3" class="blink"/>
  <text x="38" y="31" class="t" fill="url(#st-silver)">SYSTEM.STATS</text>
  <text x="473" y="31" class="sm" text-anchor="end">@JUDEATABLATE</text>
  <line x1="22" y1="44" x2="473" y2="44" stroke="url(#st-pink)" stroke-width="1" opacity=".55"/>
  <g class="fade" style="animation-delay:0.15s">
    <rect x="26" y="64" width="4" height="4" fill="#FF4FA3" transform="rotate(45 28 66)"/>
    <text x="40" y="70" class="lb">CONTRIBUTIONS · 1Y</text>
    <line x1="190" y1="66" x2="268" y2="66" stroke="#2A2430" stroke-dasharray="2 4"/>
    <text x="300" y="70" class="v" text-anchor="end">163</text>
  </g>
  <g class="fade" style="animation-delay:0.25s">
    <rect x="26" y="86" width="4" height="4" fill="#FF4FA3" transform="rotate(45 28 88)"/>
    <text x="40" y="92" class="lb">COMMITS · 2026</text>
    <line x1="190" y1="88" x2="268" y2="88" stroke="#2A2430" stroke-dasharray="2 4"/>
    <text x="300" y="92" class="v" text-anchor="end">144</text>
  </g>
  <g class="fade" style="animation-delay:0.35s">
    <rect x="26" y="108" width="4" height="4" fill="#FF4FA3" transform="rotate(45 28 110)"/>
    <text x="40" y="114" class="lb">PULL REQUESTS</text>
    <line x1="190" y1="110" x2="268" y2="110" stroke="#2A2430" stroke-dasharray="2 4"/>
    <text x="300" y="114" class="v" text-anchor="end">2</text>
  </g>
  <g class="fade" style="animation-delay:0.45s">
    <rect x="26" y="130" width="4" height="4" fill="#FF4FA3" transform="rotate(45 28 132)"/>
    <text x="40" y="136" class="lb">ISSUES</text>
    <line x1="190" y1="132" x2="268" y2="132" stroke="#2A2430" stroke-dasharray="2 4"/>
    <text x="300" y="136" class="v" text-anchor="end">0</text>
  </g>
  <g class="fade" style="animation-delay:0.55s">
    <rect x="26" y="152" width="4" height="4" fill="#FF4FA3" transform="rotate(45 28 154)"/>
    <text x="40" y="158" class="lb">STARS EARNED</text>
    <line x1="190" y1="154" x2="268" y2="154" stroke="#2A2430" stroke-dasharray="2 4"/>
    <text x="300" y="158" class="v" text-anchor="end">0</text>
  </g>
  <g class="fade" style="animation-delay:0.65s">
    <rect x="26" y="174" width="4" height="4" fill="#FF4FA3" transform="rotate(45 28 176)"/>
    <text x="40" y="180" class="lb">PUBLIC REPOS</text>
    <line x1="190" y1="176" x2="268" y2="176" stroke="#2A2430" stroke-dasharray="2 4"/>
    <text x="300" y="180" class="v" text-anchor="end">20</text>
  </g>
  <g class="fade" style="animation-delay:.3s">
    <circle cx="400" cy="122" r="59" fill="none" stroke="#2A2430" stroke-dasharray="1 5"/>
    <circle cx="400" cy="122" r="50" fill="none" stroke="#1E1A24" stroke-width="8"/>
    <circle cx="400" cy="122" r="50" fill="none" stroke="url(#st-pink)" stroke-width="8"
      stroke-linecap="round" transform="rotate(-90 400 122)"
      stroke-dasharray="29.9 314.2" stroke-dashoffset="29.9"
      style="animation: draw 1.4s ease-out .4s forwards"/>
    <text x="400" y="124" text-anchor="middle" style="font-size:24px;font-weight:800" fill="url(#st-silver)">10%</text>
    <text x="400" y="141" text-anchor="middle" class="sm">DAYS ACTIVE</text>
    <text x="400" y="198" text-anchor="middle" class="sm">2 FOLLOWERS · 0 COLLABS</text>
  </g>
</svg>
